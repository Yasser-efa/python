<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#00f2fe"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)"/>

  <!-- Clock face -->
  <circle cx="64" cy="64" r="45" fill="none" stroke="white" stroke-width="4"/>

  <!-- Clock center -->
  <circle cx="64" cy="64" r="4" fill="white"/>

  <!-- Hour hand -->
  <line x1="64" y1="64" x2="64" y2="35" stroke="white" stroke-width="4" stroke-linecap="round"/>

  <!-- Minute hand -->
  <line x1="64" y1="64" x2="85" y2="50" stroke="white" stroke-width="3" stroke-linecap="round"/>

  <!-- YouTube play symbol (small) -->
  <path d="M54 90 L54 78 L66 84 Z" fill="white" opacity="0.8"/>
</svg>
